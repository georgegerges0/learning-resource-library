name: Kadidjiny Library Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install --prefix backend

      - name: Run backend verification suite (T1-T6)
        run: npm test --prefix backend

      - name: Install frontend dependencies
        run: npm install --prefix frontend --legacy-peer-deps

      - name: Run frontend UI & accessibility tests (T7)
        env:
          CI: true
        run: npm test --prefix frontend -- --watchAll=false

      - name: Verify production React build
        run: npm run build --prefix frontend
